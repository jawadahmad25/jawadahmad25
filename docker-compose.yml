version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: antenna_ml_db
    environment:
      POSTGRES_USER: antenna_ml
      POSTGRES_PASSWORD: antenna_ml_dev
      POSTGRES_DB: antenna_ml_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antenna_ml -d antenna_ml_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antenna_ml_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/storage
    environment:
      DATABASE_URL: postgresql://antenna_ml:antenna_ml_dev@db:5432/antenna_ml_hub
      STORAGE_PATH: /storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antenna_ml_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
